# Протоколер в Docker: веб-приложение + локальная SurrealDB (+ опционально Ollama).
#
# Быстрый старт (контур компании): deploy/contour/README.md
#   cp deploy/contour/env.contour.example .env   # заполнить
#   docker compose up -d                          # web + surrealdb
#   docker compose --profile ollama up -d         # + свой Ollama, если LLM-сервера в контуре нет
#
# Текущий прод (systemd + npm start, облачная БД) этот файл НЕ использует.
#
# Имя проекта задаёт префикс томов (<name>_surreal-data). Не меняйте его на
# живой установке: новое имя = новые пустые тома.
name: ${COMPOSE_PROJECT_NAME:-forus-chatbot}

services:
  surrealdb:
    # Та же версия, что у облачной БД (проверено: surrealdb-2.6.5) — экспорт из
    # облака импортируется без конвертации. npm-клиент surrealdb 1.x не
    # поддерживает движок 3.x: не ставьте :latest.
    image: ${SURREALDB_IMAGE:-surrealdb/surrealdb:v2.6.5}
    restart: unless-stopped
    # Образ по умолчанию может работать не от root — без этого RocksDB в named volume часто даёт EACCES (код 13).
    user: "0:0"
    command:
      - start
      - --log
      - warn
      - --bind
      - 0.0.0.0:8000
      - --user
      - root
      - --pass
      - ${SURREALDB_PASSWORD:?Задайте SURREALDB_PASSWORD в .env — пароль root локальной БД}
      - rocksdb:/data/database.db
    volumes:
      - surreal-data:/data
    # Только петля: БД с ПДн не должна торчать в сеть. Для доступа с другой
    # машины используйте SSH-туннель, а не 0.0.0.0.
    ports:
      - "${SURREAL_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${WEB_IMAGE:-protokoler-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Всё из .env попадает в контейнер как есть (ключ модели,
    # SESSION_SECRET, ADMIN_USERNAMES …). Ниже — только то, что внутри compose
    # обязано отличаться от запуска на хосте.
    env_file:
      - path: .env
        required: false
    environment:
      # Локальная БД из этого же compose. Чтобы временно работать с облачной —
      # задайте SURREALDB_URL=wss://…/rpc и остальные SURREALDB_* в .env.
      # SURREALDB_* приоритетнее SURREAL_* (lib/surreal-env.ts), поэтому
      # облачные SURREAL_URL/SURREAL_PASS из старого .env сюда не протекут.
      SURREALDB_URL: ${SURREALDB_URL:-ws://surrealdb:8000/rpc}
      SURREALDB_NAMESPACE: ${SURREALDB_NAMESPACE:-chatbot}
      SURREALDB_DATABASE: ${SURREALDB_DATABASE:-main}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:?Задайте SURREALDB_PASSWORD в .env}
      # Без постоянного секрета каждый перезапуск контейнера разлогинивает всех.
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env (openssl rand -hex 32)}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      surrealdb:
        condition: service_healthy
    # По умолчанию только петля: снаружи ходят через reverse-proxy с TLS
    # (nginx и т.п.). WEB_PORT=0.0.0.0:3000 — если прокси на другой машине.
    ports:
      - "${WEB_PORT:-127.0.0.1:3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    # Только если в контуре нет своего LLM-сервера. GPU подключается через
    # docker-compose.gpu.yml (см. deploy/contour/README.md).
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-127.0.0.1:11434}:11434"

volumes:
  surreal-data:
  ollama-data:
