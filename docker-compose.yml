# Имя проекта задаёт префикс томов (<name>_surreal-data). Для общей БД с другим деплоем:
# COMPOSE_PROJECT_NAME=forus в .env или: docker compose -p forus up -d
name: ${COMPOSE_PROJECT_NAME:-forus-chatbot}

services:
  surrealdb:
    # surrealdb npm ^1.x supports engine versions < 3.0.0 — do not use :latest (SurrealDB 3.x) until the JS SDK is upgraded.
    image: ${SURREALDB_IMAGE:-surrealdb/surrealdb:v2.6.5}
    # Образ по умолчанию может работать не от root — без этого RocksDB в named volume часто даёт EACCES (код 13).
    user: "0:0"
    command:
      - start
      - --log
      - warn
      - --bind
      - 0.0.0.0:8000
      - --user
      - root
      - --pass
      - ${SURREAL_ROOT_PASSWORD:-${SURREALDB_PASSWORD:-root}}
      - rocksdb:/data/database.db
    volumes:
      - surreal-data:/data
    ports:
      - "${SURREAL_PORT:-8000}:8000"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      surrealdb:
        condition: service_started
    environment:
      SURREALDB_URL: ${SURREALDB_URL:-ws://surrealdb:8000/rpc}
      SURREALDB_NAMESPACE: ${SURREALDB_NAMESPACE:-chatbot}
      SURREALDB_DATABASE: ${SURREALDB_DATABASE:-main}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:-root}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_DEFAULT: ${OPENROUTER_MODEL_DEFAULT:-arcee-ai/trinity-large-preview:free}
      NEXT_PUBLIC_LOCAL_MODELS: ${NEXT_PUBLIC_LOCAL_MODELS:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      ALLOWED_OLLAMA_MODELS: ${ALLOWED_OLLAMA_MODELS:-}
      CHAT_PROVIDER_DEFAULT: ${CHAT_PROVIDER_DEFAULT:-ollama}
      LLM_FORCE_NONSTREAM: ${LLM_FORCE_NONSTREAM:-true}
      RAG_OLLAMA_BASE_URL: ${RAG_OLLAMA_BASE_URL:-}
      RAG_LOCAL_OPENAI_BASE_URL: ${RAG_LOCAL_OPENAI_BASE_URL:-}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-4096}
      OLLAMA_PROTOCOL_MAX_OUTPUT_TOKENS: ${OLLAMA_PROTOCOL_MAX_OUTPUT_TOKENS:-8192}
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  surreal-data:
