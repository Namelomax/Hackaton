# Скопируйте в docker-compose.override.yml в корне репозитория — тогда
#   docker compose up -d
# подхватит этот файл автоматически и Ollama смонтирует УЖЕ ЗАПОЛНЕННЫЙ том
# chatbot_ollama_data (как в старом chatbot), а не пустой <проект>_ollama_data.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Имя тома проверьте: docker volume ls | grep ollama
# Если том называется иначе — замените ключ и имя в секции volumes ниже.
# Не держите два контейнера ollama с одним томом одновременно.

services:
  ollama:
    volumes:
      - chatbot_ollama_data:/root/.ollama

volumes:
  chatbot_ollama_data:
    external: true
